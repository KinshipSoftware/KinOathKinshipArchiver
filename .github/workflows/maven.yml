name: MVN Run Tests and Publish Artifacts
on:
  push:
    #branches-ignore:
    #  - '**' # disables this job 
    branches: [ KinOath.1.7.postTLA ]
jobs:
  cleanTestDeploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 30000
        ref: KinOath.1.7.postTLA
    - name: Set up JDK 11
      uses: actions/setup-java@v3
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: maven
    - name: clean_test_deploy
      # sed -i 's|<versionCheck.allowSnapshots>true</versionCheck.allowSnapshots>|<versionCheck.allowSnapshots>false</versionCheck.allowSnapshots>|g' ./pom.xml;
      run: pwd;
            mvn clean test deploy -DaltDeploymentRepository=snapshot-repo::default::file:../snapshots;
            git status;
            ls -l;
            sed -i 's|<application.branch>pretesting</application.branch>|<application.branch>testing</application.branch>|g' ./pom.xml;
            sed -i 's|-pretesting-SNAPSHOT|-testing-SNAPSHOT|g' ./pom.xml ./*/pom.xml;           
            mvn clean test deploy -DaltDeploymentRepository=snapshot-repo::default::file:../snapshots;
            git rev-list --count --all desktop;
            sed -i '/batik-renderer/{n;s/-testing-SNAPSHOT/.'$(git rev-list --count --all batik-renderer)'-testing/}' ./*/pom.xml;
            sed -i '/kinoath-rest/{n;s/-testing-SNAPSHOT/.'$(git rev-list --count --all rest)'-testing/}' ./*/pom.xml;
            sed -i '/kinoath-core/{n;s/-testing-SNAPSHOT/.'$(git rev-list --count --all core)'-testing/}' ./*/pom.xml;
            sed -i '/kinoath-diagram/{n;s/-testing-SNAPSHOT/.'$(git rev-list --count --all diagram)'-testing/}' ./*/pom.xml;
            sed -i '/kinoath-desktop/{n;s/-testing-SNAPSHOT/.'$(git rev-list --count --all desktop)'-testing/}' ./desktop/pom.xml;
            sed -i '/graph-sorter/{n;s/-testing-SNAPSHOT/.'$(git rev-list --count --all graph-sorter)'-testing/}' ./*/pom.xml;
            sed -i '/kin-type-string-parser/{n;s/-testing-SNAPSHOT/.'$(git rev-list --count --all kin-type-string-parser)'-testing/}' ./*/pom.xml;
            sed -i '/core/{n;s/-testing-SNAPSHOT/.'$(git rev-list --count --all core)'-testing/}' ./core/pom.xml;
            sed -i '/diagram/{n;s/-testing-SNAPSHOT/.'$(git rev-list --count --all diagram)'-testing/}' ./diagram/pom.xml;
            sed -i '/graph-storage/{n;s/-testing-SNAPSHOT/.'$(git rev-list --count --all graph-storage)'-testing/}' ./graph-storage/pom.xml;
            sed -i '/kinoath-help/{n;s/-testing-SNAPSHOT/.'$(git rev-list --count --all kinoath-help)'-testing/}' ./kinoath-help/pom.xml;
            sed -i '/localisation/{n;s/-testing-SNAPSHOT/.'$(git rev-list --count --all localisation)'-testing/}' ./localisation/pom.xml;
            sed -i '/rest/{n;s/-testing-SNAPSHOT/.'$(git rev-list --count --all rest)'-testing/}' ./rest/pom.xml;
            git diff;
            mvn clean test deploy -DaltDeploymentRepository=snapshot-repo::default::file:../snapshots;
            echo "target";
            ls -l desktop/target;
            echo "snapshots";
            ls -l ../snapshots;
            jpackage --input desktop/target/ --type deb --name KinOathDesktop --app-version 1.7.$(git rev-list --count --all desktop) --icon desktop/src/main/resources/nl/mpi/kinnate/resources/icons/kinoath-testing128x128.png --main-jar kinnate-1.7.$(git rev-list --count --all desktop)-testing.jar;
            jpackage --input desktop/target/ --type rpm --name KinOathDesktop --app-version 1.7.$(git rev-list --count --all desktop) --icon desktop/src/main/resources/nl/mpi/kinnate/resources/icons/kinoath-testing128x128.png --main-jar kinnate-1.7.$(git rev-list --count --all desktop)-testing.jar;
            ls -l;
            mkdir stored_data;
            mkdir stored_data/public;
            mkdir stored_data/public/installers;
            mkdir ../snapshots/installers;
            pwd;
            cp -r desktop/target stored_data/;
            cp -r kinoathdesktop_1.7.*.deb stored_data/public/installers/;
            cp -r kinoathdesktop-1.7.*.rpm stored_data/public/installers/;
            cp -r ../snapshots/nl stored_data/public/;
            echo "1.7.$(git rev-list --count --all desktop)" > stored_data/public/kinoath-testing-current.txt;
            ls -l stored_data/*;
    - name: Store build output
      uses: actions/upload-artifact@v4
      with:
        name: stored_data
        path: stored_data
  packageDMG:
    name: packageDMG
    needs: cleanTestDeploy
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 30000
        ref: KinOath.1.7.postTLA
    - name: Set up JDK 21
      # https://github.com/adoptium/temurin21-binaries/releases/tag/jdk-21.0.6%2B7
      # https://github.com/adoptium/temurin21-binaries/releases/download/jdk-21.0.6%2B7/OpenJDK21U-jdk_aarch64_mac_hotspot_21.0.6_7.tar.gz
      # https://github.com/adoptium/temurin21-binaries/releases/download/jdk-21.0.6%2B7/OpenJDK21U-jdk_x64_mac_hotspot_21.0.6_7.tar.gz
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
        architecture: x64
    - name: Retrieve build output
      uses: actions/download-artifact@v4
      with:
        name: stored_data
        path: stored_data
    - name: Generate DMG
      # jpackage --input stored_data/target/ --type dmg --name KinOathDesktop-arm64-1.7.$(git rev-list --count --all desktop) --app-version 1.7.$(git rev-list --count --all desktop) --icon desktop/src/main/resources/nl/mpi/kinnate/resources/icons/kinoath-testing.icns --main-jar kinnate-1.7.$(git rev-list --count --all desktop)-testing.jar;
      # arch -x86_64 jpackage --input stored_data/target/ --type dmg --name KinOathDesktop-x64-1.7.$(git rev-list --count --all desktop) --app-version 1.7.$(git rev-list --count --all desktop) --icon desktop/src/main/resources/nl/mpi/kinnate/resources/icons/kinoath-testing.icns --main-jar kinnate-1.7.$(git rev-list --count --all desktop)-testing.jar;
      run: pwd;
            java --version;
            jpackage --input stored_data/target/ --type dmg --name KinOathDesktop-1.7.$(git rev-list --count --all desktop) --app-version 1.7.$(git rev-list --count --all desktop) --icon desktop/src/main/resources/nl/mpi/kinnate/resources/icons/kinoath-testing.icns --main-jar kinnate-1.7.$(git rev-list --count --all desktop)-testing.jar;
            ls -l;
            cp -r KinOathDesktop-*-1.7.*.dmg stored_data/public/installers/;
            ls -l stored_data/*;
            ls -l stored_data/public/installers/;
            ls -l stored_data/public/installers/*;
    - name: Store build output
      uses: actions/upload-artifact@v4
      with:
        name: stored_data
        path: stored_data
        overwrite: true
  packageMSI:
    name: packageMSI
    needs: packageDMG
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 30000
        ref: KinOath.1.7.postTLA
    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        distribution: 'microsoft'
        java-version: '17'
        cache: maven
    - name: Retrieve build output
      uses: actions/download-artifact@v4
      with:
        name: stored_data
        path: stored_data
    - name: Generate MSI
      run: pwd;
            java --version;
            jpackage --input stored_data/target --type msi  --name KinOathDesktop-1.7.$(git rev-list --count --all desktop) --app-version 1.7.$(git rev-list --count --all desktop) --icon desktop/src/main/resources/nl/mpi/kinnate/resources/icons/kinoath-testing128x128.ico --main-jar kinnate-1.7.$(git rev-list --count --all desktop)-testing.jar;
            jpackage --input stored_data/target --type exe  --name KinOathDesktop-1.7.$(git rev-list --count --all desktop) --app-version 1.7.$(git rev-list --count --all desktop) --icon desktop/src/main/resources/nl/mpi/kinnate/resources/icons/kinoath-testing128x128.ico --main-jar kinnate-1.7.$(git rev-list --count --all desktop)-testing.jar;
            cp -r KinOathDesktop-1.7.*.msi stored_data/public/installers/;
            cp -r KinOathDesktop-1.7.*.exe stored_data/public/installers/;
            #for FILE in stored_data/public/installers/KinOathDesktop*1.7*; do
            #  echo '<a href="https://kinshipsoftware.github.io/KinOathKinshipArchiver/installers/'$(basename "$FILE")'">'$(basename "$FILE")'</a><br/>' >> stored_data/public/KinOathDesktop-1.7.html;
            #done;
            #ls -l stored_data/*;
            #ls -l stored_data/public/installers/;
            #ls -l stored_data/public/installers/*;
    - name: Store build output
      uses: actions/upload-artifact@v4
      with:
        name: stored_data
        path: stored_data
        overwrite: true
  deploySnapshotsInstallers:
    name: deploySnapshotsInstallers
    needs: packageMSI
    runs-on: ubuntu-latest
    steps:
    - name: Retrieve build output
      uses: actions/download-artifact@v4
      with:
        name: stored_data
        path: stored_data
    - name: Deploy Snapshots Installers
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: stored_data/public
        keep_files: true
